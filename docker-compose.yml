name: plandekton

services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: plandekton_wordpress
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-plandekton_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-plandekton_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}
    volumes:
      - wordpress_data:/var/www/html
      - ./plan-dekton-studio:/var/www/html/wp-content/themes/plan-dekton-studio
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: plandekton_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-plandekton_wp}
      MARIADB_USER: ${WORDPRESS_DB_USER:-plandekton_wp}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql

  cli:
    image: wordpress:cli-php8.2
    profiles:
      - tools
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-plandekton_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-plandekton_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me}
    volumes:
      - wordpress_data:/var/www/html
      - ./plan-dekton-studio:/var/www/html/wp-content/themes/plan-dekton-studio

volumes:
  wordpress_data:
    name: plandekton_wordpress_data
  db_data:
    name: plandekton_db_data
